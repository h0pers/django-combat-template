name: Template Validation

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        use_drf: ["y", "n"]
        use_wagtail: ["y", "n"]
        use_vue: ["y", "n"]

    name: drf=${{ matrix.use_drf }},wagtail=${{ matrix.use_wagtail }},vue=${{ matrix.use_vue }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Cookiecutter
        run: uv tool install cookiecutter

      - name: Setup Node.js
        if: matrix.use_vue == 'y'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate project
        run: cookiecutter . --no-input use_drf=${{ matrix.use_drf }} use_wagtail=${{ matrix.use_wagtail }} use_vue=${{ matrix.use_vue }}

      - name: Run pre-commit
        working-directory: my-django-project
        run: |
          git init
          git add .
          uvx pre-commit run --all-files

      - name: Build Docker image
        working-directory: my-django-project
        run: |
          docker build --target test -t backend:test .

      - name: Run tests
        working-directory: my-django-project
        run: |
          docker compose -f docker-compose.test.yml run --rm test