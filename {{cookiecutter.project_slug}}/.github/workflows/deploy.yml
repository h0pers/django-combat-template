name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./docker/nginx
          push: true
          pull: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}-nginx:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-nginx:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-nginx:buildcache,mode=max

      - name: Cleanup old images
        uses: snok/container-retention-policy@v3.0.0
        with:
          account: user
          token: ${{ secrets.PACKAGES_TOKEN }}
          image-names: "${{ github.event.repository.name }} ${{ github.event.repository.name }}-nginx"
          cut-off: 1h
          tag-selection: untagged

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          {
            echo "GITHUB_REPOSITORY=${{ github.repository }}"
            echo "MY_DOMAIN=${{ vars.MY_DOMAIN }}"
            echo "DJANGO_ENV=production"
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}"
            echo "POSTGRES_HOST=postgres"
            echo "POSTGRES_PORT=5432"
            echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}"
            echo "CACHE_URL=redis://redis:6379/0"
            if [ -n "${{ secrets.DJANGO_SUPERUSER_USERNAME }}" ]; then
              echo "DJANGO_SUPERUSER_USERNAME=${{ secrets.DJANGO_SUPERUSER_USERNAME }}"
            fi
            if [ -n "${{ secrets.DJANGO_SUPERUSER_PASSWORD }}" ]; then
              echo "DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}"
            fi
            if [ -n "${{ secrets.DJANGO_SUPERUSER_EMAIL }}" ]; then
              echo "DJANGO_SUPERUSER_EMAIL=${{ secrets.DJANGO_SUPERUSER_EMAIL }}"
            fi
          } > .env

      - name: Create walg.env
        run: |
          touch walg.env
          if [ -n "${{ secrets.WALG_S3_PREFIX }}" ]; then
            if [ -z "${{ secrets.WALG_LIBSODIUM_KEY }}" ]; then
              echo "WALG_LIBSODIUM_KEY secret is required when WALG_S3_PREFIX is set" >&2
              exit 1
            fi
            {
              echo "WALG_S3_PREFIX=${{ secrets.WALG_S3_PREFIX }}"
              echo "AWS_ENDPOINT=${{ secrets.WALG_AWS_ENDPOINT }}"
              echo "AWS_REGION=${{ secrets.WALG_AWS_REGION }}"
              echo "AWS_ACCESS_KEY_ID=${{ secrets.WALG_AWS_ACCESS_KEY_ID }}"
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.WALG_AWS_SECRET_ACCESS_KEY }}"
              echo "AWS_S3_FORCE_PATH_STYLE=${{ secrets.WALG_AWS_S3_FORCE_PATH_STYLE }}"
              echo "WALG_LIBSODIUM_KEY=${{ secrets.WALG_LIBSODIUM_KEY }}"
              echo "WALG_LIBSODIUM_KEY_TRANSFORM=hex"
            } > walg.env
          fi

      - name: Copy configs to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env,walg.env,docker-compose.yml,docker"
          target: "~/${{ github.event.repository.name }}/"
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,REPO_NAME
          script: |
            set -euo pipefail
            APP_DIR="$HOME/$REPO_NAME"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            docker compose pull backend nginx
            docker compose up -d --build postgres postgres-backup redis nginx
            docker compose run --rm backend python manage.py migrate --noinput

            docker rollout backend --timeout 120

            docker image prune -f
