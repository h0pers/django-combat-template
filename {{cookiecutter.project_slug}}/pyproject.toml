[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django~=5.2.9",
    "django-environ>=0.12.0",
    "django-redis>=7.0.0",
    "django-split-settings>=1.3.2",
{%- if cookiecutter.use_drf == "y" %}
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.29.0",
{%- endif %}
{%- if cookiecutter.use_wagtail == "y" %}
    "wagtail>=7.4.2",
{%- endif %}
{%- if cookiecutter.use_vue == "y" %}
    "django-vite>=3.1.0",
{%- endif %}
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.3.2",
    "secure>=1.0.1",
]

[dependency-groups]
test = [
    "coverage>=7.13.1",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
]
dev = [
    {include-group = "test"},
{%- if cookiecutter.use_drf == "y" %}
    "djangorestframework-stubs>=3.17.0",
{%- endif %}
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
]

[tool.ruff]
 # Assume Python 3.14
target-version = "py314"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".github",
    ".hg",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "migrations",
    "node_modules",
    "static",
]

[tool.ruff.lint]
select = [
  "E",    # Enforce pycodestyle errors (strict style and formatting correctness).
  "W",    # Enforce pycodestyle warnings for consistent formatting.
  "F",    # Pyflakes: detect unused names, undefined variables, and import issues.
  "I",    # isort: normalize and group imports; mostly auto-fixable.
  "B",    # flake8-bugbear: flag likely bugs and bad practices.
  "C4",   # flake8-comprehensions: suggest efficient, readable comprehensions.
  "UP",   # pyupgrade: modernize syntax to the target Python version.
  "A",    # flake8-builtins: prevent shadowing of Python built-in names.
  "DJ",   # flake8-django: Django-specific best practices and safety checks.
  "TID",  # tidy-imports: import hygiene beyond isort (no star/re-exports).
  "T20",  # flake8-print: disallow print/pprint in production code.
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Split-settings files reference vars defined in base settings at runtime
"website/website/settings/environments/*.py" = ["F821"]
"website/website/settings/components/*.py" = ["F821"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
