services:
  postgres:
    image: ghcr.io/${GITHUB_REPOSITORY}-postgres:latest
    env_file:
      - path: walg.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "archive_mode=on", "-c", "archive_command=wal-g wal-push %p", "-c", "archive_timeout=60"]
    restart: unless-stopped
    volumes:
      - "postgres-data:/var/lib/postgresql/data/"
      - "postgres-backups:/backups"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: ghcr.io/${GITHUB_REPOSITORY}-postgres:latest
    user: postgres
    command: ["backup-scheduler.sh"]
    env_file:
      - path: walg.env
        required: false
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - "postgres-data:/var/lib/postgresql/data/"
      - "postgres-backups:/backups"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    env_file: .env
    environment:
      - "DJANGO_ENV=production"
      - "DJANGO_ALLOWED_HOSTS=${MY_DOMAIN}"
      - "DJANGO_CSRF_TRUSTED_ORIGINS=https://${MY_DOMAIN}"
{%- if cookiecutter.use_wagtail == "y" %}
      - "WAGTAILADMIN_BASE_URL=https://${MY_DOMAIN}"
{%- endif %}
    restart: unless-stopped
    volumes:
      - "staticfiles-data:/var/www/static"
      - "media-data:/var/www/media"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider --header=\"Host: $$MY_DOMAIN\" --header=\"X-Forwarded-Proto: https\" http://127.0.0.1:8000/api/health/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${MY_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=le"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.priority=1"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${COMPOSE_PROJECT_NAME}-no-server"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-no-server.headers.customresponseheaders.Server="
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8000"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-www.rule=Host(`www.${MY_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-www.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-www.tls.certresolver=le"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-www.priority=1"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-www.middlewares=${COMPOSE_PROJECT_NAME}-www-redirect"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-www-redirect.redirectregex.regex=^https?://www\\.${MY_DOMAIN}/?(.*)"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-www-redirect.redirectregex.replacement=https://${MY_DOMAIN}/$${1}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-www-redirect.redirectregex.permanent=true"
    networks:
      - default
      - traefik-public

  nginx:
    image: ghcr.io/${GITHUB_REPOSITORY}-nginx:latest
    restart: unless-stopped
    volumes:
      - type: volume
        source: staticfiles-data
        target: /usr/share/nginx/html/static
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: media-data
        target: /usr/share/nginx/html/media
        read_only: true
        volume:
          nocopy: true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-files.rule=Host(`${MY_DOMAIN}`) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-files.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-files.tls.certresolver=le"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-files.priority=2"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-files.middlewares=${COMPOSE_PROJECT_NAME}-nosniff,${COMPOSE_PROJECT_NAME}-no-server"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-nosniff.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-no-server.headers.customresponseheaders.Server="
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-files.loadbalancer.server.port=80"
    networks:
      - default
      - traefik-public

volumes:
  postgres-data:
  postgres-backups:
  staticfiles-data:
  media-data:

networks:
  traefik-public:
    external: true
